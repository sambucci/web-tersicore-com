name: Link check (CI half of the paired measurement)

# The CI half of this site's audit. It has NO schedule on purpose.
#
# GitHub disables a scheduled workflow after ~60 days without repository
# activity, and an autopilot reference site is exactly that profile: nothing
# commits here between audits. A monthly cron on this repo would have run in
# September and October 2026 and then silently stopped, with no symptom anywhere,
# which is the same failure class as analytics going flat.
#
# So the cadence lives in the local scheduled routine
# ("tersicore-semiannual-judgment-review", March and September), which runs the
# same checker locally and then dispatches THIS workflow to get the second half
# of the rule 6 paired measurement. With no cron here, the 60-day rule cannot
# apply to it at all, which is the point: nothing has to be kept warm.
#
# It never edits or deletes anything: every finding is a proposal for a human,
# and the report says so in its own header.

on:
  workflow_dispatch:
    inputs:
      controls_only:
        description: 'Dry run: exercise the control set only, do not walk the inventory'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    name: Check every external URL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the CA bundle
        # The checker verifies TLS strictly. certifi keeps the trust store the
        # same here and on a local Windows run, whose system store is incomplete.
        run: python -m pip install --quiet --upgrade certifi

      - name: Control set (gate)
        run: python tools/link_check.py --controls-only

      - name: Run link check
        if: ${{ inputs.controls_only != true }}
        id: check
        run: python tools/link_check.py --out audit/link-check-report.md --json audit/link-check.audit.json

      - name: Upload report
        if: ${{ inputs.controls_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: audit/
          retention-days: 90

      - name: Open an issue when there are actionable findings
        if: ${{ inputs.controls_only != true && steps.check.outputs.actionable != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('audit/link-check-report.md', 'utf8');
            const LIMIT = 60000;
            if (body.length > LIMIT) {
              body = body.slice(0, LIMIT) +
                '\n\n---\n\n*Report truncated for the issue body. The complete report is the ' +
                '`link-check-report` artifact on this workflow run.*\n';
            }
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Link check ${today}: ${{ steps.check.outputs.actionable }} actionable findings`,
              body,
              labels: ['link-rot'],
            });

      - name: Fail the run if the control set was unreliable
        if: ${{ inputs.controls_only != true && steps.check.outputs.controls_ok == 'false' }}
        run: |
          echo "::error::Control set failed, so this run's findings are not trustworthy."
          exit 1
